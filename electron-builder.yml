appId: com.claudeworld.bot
productName: Claude World Bot
directories:
  output: out
  # No app icon yet: assets/icon.png is the 22x22 tray glyph, and macOS app icons
  # must be at least 512x512, so the bundle uses Electron's default icon.
  buildResources: build
files:
  - dist/**/*
  - ui/dist/**/*
  - assets/**/*
  - "!node_modules/**/{test,__tests__,tests}/**"
  - "!node_modules/**/*.{md,ts,map}"
mac:
  category: public.app-category.developer-tools
  target: dmg
dmg:
  title: Claude World Bot
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
extraMetadata:
  main: dist/electron/main.js
